<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — Foodie Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">

  <div class="auth-visual">
    <a href="home.html" class="logo">Foodie<span>Express</span></a>
    <h1>Hungry?<br><em>Let's fix that.</em></h1>
    <p>Create an account to order from the local kitchens, save your addresses, and track deliveries live.</p>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <h2>Create your account</h2>
      <p class="sub">It only takes a minute.</p>

      <!--
        NOTE ON PHONE NUMBER:
        Your User POJO / INSERT_QUERY / RegisterServlet currently do NOT
        have a phone field, so this form intentionally leaves it out —
        adding an input here without backend support would just silently
        drop the value. To add phone support later you'd need to:
          1) add `private String phone;` + getters/setters to User.java
          2) add a `phone` column to the `user` table in MySQL
          3) add `phone` to INSERT_QUERY / UPDATE_QUERY in UserDaoImp
          4) add `pstm.setString(n, user.getPhone());` in addUser()
          5) add `String phone = req.getParameter("phone");` in RegisterServlet
             and pass it into the User constructor
      -->
      <form action="register" method="post" id="signupForm">
        <div class="field-group">
          <label for="userName">Full name / username</label>
          <input type="text" id="userName" name="userName" placeholder="Your name" required />
        </div>
        <div class="field-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="field-group">
          <label for="address">Delivery address</label>
          <input type="text" id="address" name="address" placeholder="House no, street, area" required />
        </div>
        <div class="field-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8" />
        </div>
        <div class="field-group">
          <label for="role">Sign up as</label>
          <select id="role" name="role" required>
            <option value="" disabled selected>Choose one</option>
            <option value="Customer">Customer — order food</option>
            <option value="Delivery agent">Delivery agent — deliver food</option>
            <option value="Admin">Admin</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign up</button>
      </form>

      <div class="divider">or</div>

      <p class="form-foot">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>

</div>

<script src="js/app.js"></script>
</body>
</html>
