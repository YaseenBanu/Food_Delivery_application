<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Foodie Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">

  <div class="auth-visual">
    <a href="home.html" class="logo">Foodie<span>Express</span></a>
    <h1>Welcome back.<br><em>The Food is waiting.</em></h1>
    <p>Log in to order, reorder favourites in one tap, and pick up right where you left off.</p>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <a href="home.html" class="logo" style="display:none;">Foodie<span>Express</span></a>
      <h2>Log in</h2>
      <p class="sub">Enter your details to continue.</p>

      <!--
        Your LoginServlet currently redirects failed logins straight to
        invalid.html (a full page), rather than forwarding an error back
        here — so no inline banner is needed on this page right now.
      -->
      <form action="callloginServlet" method="post" id="loginForm">
        <div class="field-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="field-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>

      <div class="divider">or</div>

      <p class="form-foot">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </div>

</div>

<script src="js/app.js"></script>
</body>
</html>
